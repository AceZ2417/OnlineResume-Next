name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 并发 + 取消排队中旧任务，避免同一分支多任务抢 Pages token
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# 消除 GitHub Actions runner 对 Node.js 20 的弃用告警
# （参考 https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute base path
        id: base
        shell: bash
        run: |
          # 自定义域名 / <user>.github.io 根仓库：BASE_PATH="/"
          # 项目页仓库（https://<user>.github.io/<repo>/）：BASE_PATH="/<repo>/"
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Setup Pages (必须在上传前配置：写入 Pages artifact 元数据)
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
